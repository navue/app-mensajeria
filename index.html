<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App Mensajería</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
  
<!-- Login -->
<div id="loginView">
  <h2>Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Contraseña">

  <div class="button-group">
    <button onclick="login()">Ingresar</button>
    <button onclick="showRegister()">Registrarse</button>
  </div>
</div>

<!-- Registro -->
<div id="registerView" style="display:none;">
  <h2>Crear cuenta</h2>

  <div class="photo-container">
    <label class="photo-label">
      <img id="photoPreview" src="assets/images/foto.png" onclick="handlePhotoClick()">
      <span class="photo-text">Foto (opcional)</span>
    </label>
    <input type="file" id="registerPhoto" accept="image/*" hidden>
  </div>
  <input type="email" id="registerEmail" placeholder="Email" required>
  <input type="password" id="registerPassword" placeholder="Contraseña" required>
  <input type="text" id="registerName" placeholder="Nombre" required>
  <input type="text" id="registerLastName" placeholder="Apellido" required>
  <input type="text" id="registerNickname" placeholder="Apodo" required>

  <div class="button-group">
    <button onclick="register()">Crear cuenta</button>
    <button onclick="showLogin()">Volver</button>
  </div>
</div>

<!-- Chat -->
<div id="chatView" style="display:none;">
  <div class="chat-card">

    <div class="chat-header">
      <h2>Chat</h2>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="chat-container">
      
      <!-- Sidebar -->
      <div class="sidebar" id="usersList"></div>

      <!-- Área de chat -->
      <div class="chat-area">
        <div id="chatBox" style="display:none;">
          <div id="messages"></div>

          <div class="message-input">
            <input id="messageInput" placeholder="Mensaje">
            <button onclick="sendMessage()">Enviar</button>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>

</body>
</html>
