<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>App Mensajería</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="app-container">
      <div id="globalMessage"></div>

      <section id="loginView" class="view">
        <h2>Iniciar Sesión</h2>
        <input
          type="email"
          id="loginEmail"
          autocomplete="off"
          placeholder="Email"
          required
        />
        <input
          type="password"
          id="loginPassword"
          autocomplete="off"
          placeholder="Contraseña"
          required
        />
        <div class="button-group">
          <button class="btn" onclick="login()">Ingresar</button>
          <button class="btn" onclick="showRegister()">Registrarse</button>
        </div>
      </section>

      <section id="registerView" class="view hidden">
        <h2>Crear cuenta</h2>
        <div class="photo-container">
          <label class="photo-label" id="registerPhotoLabel">
            <img id="photoPreview" src="assets/images/foto.png" alt="Preview" />
            <span class="photo-text">Foto (opcional)</span>
          </label>

          <input type="file" id="registerPhoto" accept="image/*" hidden />
        </div>
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input
          type="password"
          id="registerPassword"
          placeholder="Contraseña"
          required
        />
        <input type="text" id="registerName" placeholder="Nombre" required />
        <input
          type="text"
          id="registerLastName"
          placeholder="Apellido"
          required
        />
        <input type="text" id="registerNickname" placeholder="Apodo" required />
        <div class="button-group">
          <button class="btn" onclick="register()">Crear cuenta</button>
          <button class="btn btn-secondary" onclick="backToLogin()">
            Volver
          </button>
        </div>
      </section>

      <section id="editProfileView" class="view hidden">
        <h2>Editar perfil</h2>
        <div class="photo-container">
          <label class="photo-label">
            <img id="editPhotoPreview" src="assets/images/foto.png" />
            <span class="photo-text">Foto de perfil</span>
          </label>
          <input type="file" id="editPhoto" accept="image/*" hidden />
        </div>
        <input type="email" id="editProfileEmail" placeholder="Email" />
        <input type="text" id="editProfileName" placeholder="Nombre" />
        <input type="text" id="editProfileLastName" placeholder="Apellido" />
        <input type="text" id="editProfileNickname" placeholder="Apodo" />
        <input
          type="password"
          id="editProfilePassword"
          placeholder="Nueva contraseña"
        />
        <input
          type="password"
          id="editConfirmPassword"
          placeholder="Confirmar contraseña"
        />
        <div class="button-group">
          <button class="btn" onclick="saveProfile()">Guardar</button>
          <button class="btn btn-secondary" onclick="showChat()">Volver</button>
        </div>
      </section>

      <section id="chatView" class="view hidden">
        <div class="chat-card">
          <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
          </div>
          <header class="chat-header">
            <h2 class="title">Contactos</h2>
            <button class="btn btn-secondary" onclick="logout()">
              Cerrar Sesión
            </button>
          </header>
          <div class="chat-container">
            <aside class="sidebar">
              <div class="profile-card">
                <div class="profile-photo-container">
                  <img
                    id="profilePhoto"
                    src="assets/images/foto.png"
                    title="Cambiar foto de perfil"
                  />
                  <input
                    type="file"
                    id="profilePhotoInput"
                    accept="image/*"
                    hidden
                  />
                </div>
                <h3 id="profileNickname">Usuario</h3>
                <select id="profileStatus">
                  <option value="Disponible">🟢 Disponible</option>
                  <option value="Ocupado">🔴 Ocupado</option>
                  <option value="Ausente">🟡 Ausente</option>
                  <option value="No molestar">⛔ No molestar</option>
                </select>
                <button class="btn" onclick="showEditProfile()">
                  Editar perfil
                </button>
                <button
                  class="btn btn-danger"
                  onclick="showDeleteProfileModal()"
                >
                  Eliminar perfil
                </button>
              </div>
              <div id="usersList"></div>
            </aside>
            <main class="chat-area">
              <div id="chatBox" class="hidden">
                <div class="chat-header-info">
                  <div id="chatUserInfo" class="chat-user-info">
                    Seleccioná un contacto
                  </div>
                  <button id="blockUserBtn" class="btn btn-danger">
                    Bloquear
                  </button>
                </div>
                <div id="messages"></div>
                <div class="message-input">
                  <input id="messageInput" placeholder="Mensaje" required />
                  <button class="btn" id="sendBtn">Enviar</button>
                </div>
              </div>
            </main>
          </div>
        </div>
      </section>
    </div>

    <div id="deleteProfileModal" class="modal hidden">
      <div class="modal-content">
        <h3>Eliminar perfil</h3>

        <p>
          ¿Estás seguro de que quieres eliminar tu perfil? Ingresá tu contraseña
          para confirmar.
        </p>

        <input
          type="password"
          id="deleteProfilePassword"
          placeholder="Contraseña"
        />

        <div class="modal-buttons">
          <button class="btn btn-danger" onclick="confirmDeleteProfile()">
            Eliminar
          </button>

          <button class="btn btn-secondary" onclick="closeDeleteProfileModal()">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("service-worker.js")
          .then(() => console.log("Service Worker registrado"))
          .catch((err) => console.log("Error:", err));
      }
    </script>
  </body>
</html>
